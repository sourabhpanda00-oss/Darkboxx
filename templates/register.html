{% extends "base.html" %}
{% block content %}
<form method="post" style="max-width:300px;margin:50px auto;padding:20px;border:1px solid #333;border-radius:8px;background:#1a1a1a">
<h2>Register</h2>
<input type="text" name="username" placeholder="Username" required style="width:100%;padding:10px;margin:10px 0;border:1px solid #333;border-radius:4px;background:#222;color:#fff">
<input type="password" name="password" placeholder="Password" required style="width:100%;padding:10px;margin:10px 0;border:1px solid #333;border-radius:4px;background:#222;color:#fff">
<button type="submit" style="width:100%;padding:10px;background:#e50914;color:#fff;border:none;border-radius:4px;cursor:pointer">Register</button>
<p style="margin-top:15px;font-size:13px"><a href="/login" style="color:#fff">Already have account?</a></p>
</form>
{% endblock %}
